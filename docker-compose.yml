
services:
  db:
    image: postgres:16-alpine
    container_name: supplypulse-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 768m
    cpus: 1.0
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: supplypulse-airflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/metadata/airflow.db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PYTHONPATH: /opt/airflow/project
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/project/src:ro
      - ./data:/opt/airflow/project/data
      - airflow_logs:/opt/airflow/logs
      - airflow_metadata:/opt/airflow/metadata
    command: standalone
    mem_limit: 1536m
    cpus: 1.0

volumes:
  postgres_data:
  airflow_logs:
  airflow_metadata:
